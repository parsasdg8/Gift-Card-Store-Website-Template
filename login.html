<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ورود و ثبت‌نام | DSgift</title>
    <link rel="icon" type="image/png" href="./productPic/logonomy-1776982122719.jpeg">
    <link rel="stylesheet" href="./node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="./css/output.css">
</head>
<body class="bg-gray-50">

    <header class="fixed top-0 w-full bg-white border-b border-gray-200 z-50 py-3 md:py-4">
        <div class="container mx-auto px-4 max-w-[\1200px\]">
            <div class="flex justify-center items-center">
                <a href="./index.html" class="flex items-center gap-2 back-to-site">
                    <div class="w-8 h-8 md:w-10 md:h-10 rounded-xl flex items-center justify-center">
                        <img src="./productPic/logonomy-1776982122719.jpeg" alt="">
                    </div>
                    <span class="text-lg md:text-xl font-black text-black"><span class="text-orange-500">DS</span>gift</span>
                </a>
            </div>
        </div>
    </header>

    <div class="pt-20 md:pt-24"></div>

    <main class="container mx-auto px-4 py-8 md:py-12 max-w-[\1200px\]">
        
        <div class="max-w-md mx-auto">
            <div class="login-card shadow-xl overflow-hidden">
                
                <div class="flex border-b border-gray-100">
                    <button id="loginTabBtn" class="toggle-btn active flex-1 py-4 text-center font-bold text-gray-700 text-base transition-all">
                        <i class="fas fa-sign-in-alt ml-2 text-orange-500"></i>
                        ورود
                    </button>
                    <button id="registerTabBtn" class="toggle-btn flex-1 py-4 text-center font-bold text-gray-500 text-base transition-all">
                        <i class="fas fa-user-plus ml-2"></i>
                        ثبت‌نام
                    </button>
                </div>
                
                <div id="loginForm" class="form-container p-6 md:p-8 show-form">
                    <form>
                        <div class="space-y-5">
                            <div class="relative">
                                <i class="fas fa-envelope input-icon"></i>
                                <input type="email" placeholder="ایمیل یا نام کاربری" 
                                       class="w-full border border-gray-200 rounded-xl py-3 pr-12 pl-4 outline-none focus:border-orange-400 transition-all">
                            </div>
                            
                            <div class="relative">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" placeholder="رمز عبور" 
                                       class="w-full border border-gray-200 rounded-xl py-3 pr-12 pl-4 outline-none focus:border-orange-400 transition-all">
                                <button type="button" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-orange-500">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            
                            <div class="flex justify-between items-center text-sm">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-orange-500 focus:ring-orange-500">
                                    <span class="text-gray-600">مرا به خاطر بسپار</span>
                                </label>
                                <a href="#" class="text-orange-500 hover:text-orange-600 transition">رمز عبور را فراموش کرده‌اید؟</a>
                            </div>
                            
                            <button type="submit" class="w-full bg-orange-500 text-white py-3 rounded-xl font-bold hover:bg-orange-600 transition-all shadow-md">
                                ورود
                            </button>
                            
                            <div class="relative text-center my-4">
                                <div class="absolute inset-0 flex items-center">
                                    <div class="w-full border-t border-gray-200"></div>
                                </div>
                                <div class="relative bg-white px-4 text-sm text-gray-500">یا</div>
                            </div>
                            
                            <div class="flex gap-3">
                                <button class="flex-1 border border-gray-200 rounded-xl py-2.5 hover:bg-gray-50 transition flex items-center justify-center gap-2">
                                    <i class="fab fa-google text-red-500"></i>
                                    <span class="text-sm text-gray-600">گوگل</span>
                                </button>
                                <button class="flex-1 border border-gray-200 rounded-xl py-2.5 hover:bg-gray-50 transition flex items-center justify-center gap-2">
                                    <i class="fab fa-github text-gray-800"></i>
                                    <span class="text-sm text-gray-600">گیت‌هاب</span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
                
                <div id="registerForm" class="form-container p-6 md:p-8 hidden-form">
                    <form>
                        <div class="space-y-4">
                            <div class="relative">
                                <i class="fas fa-user input-icon"></i>
                                <input type="text" placeholder="نام و نام خانوادگی" 
                                       class="w-full border border-gray-200 rounded-xl py-3 pr-12 pl-4 outline-none focus:border-orange-400 transition-all">
                            </div>
                            
                            <div class="relative">
                                <i class="fas fa-envelope input-icon"></i>
                                <input type="email" placeholder="ایمیل" 
                                       class="w-full border border-gray-200 rounded-xl py-3 pr-12 pl-4 outline-none focus:border-orange-400 transition-all">
                            </div>
                            
                            <div class="relative">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" placeholder="رمز عبور" 
                                       class="w-full border border-gray-200 rounded-xl py-3 pr-12 pl-4 outline-none focus:border-orange-400 transition-all">
                                <button type="button" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-orange-500">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            
                            <div class="relative">
                                <i class="fas fa-lock input-icon"></i>
                                <input type="password" placeholder="تکرار رمز عبور" 
                                       class="w-full border border-gray-200 rounded-xl py-3 pr-12 pl-4 outline-none focus:border-orange-400 transition-all">
                            </div>
                            
                            <label class="flex items-center gap-2 cursor-pointer text-sm">
                                <input type="checkbox" class="w-4 h-4 rounded border-gray-300 text-orange-500 focus:ring-orange-500">
                                <span class="text-gray-600">قوانین و مقررات را مطالعه کرده و قبول دارم</span>
                            </label>
                            
                            <button type="submit" class="w-full bg-orange-500 text-white py-3 rounded-xl font-bold hover:bg-orange-600 transition-all shadow-md">
                                ثبت‌نام
                            </button>
                            
                            <div class="relative text-center my-4">
                                <div class="absolute inset-0 flex items-center">
                                    <div class="w-full border-t border-gray-200"></div>
                                </div>
                                <div class="relative bg-white px-4 text-sm text-gray-500">یا</div>
                            </div>
                            
                            <div class="flex gap-3">
                                <button class="flex-1 border border-gray-200 rounded-xl py-2.5 hover:bg-gray-50 transition flex items-center justify-center gap-2">
                                    <i class="fab fa-google text-red-500"></i>
                                    <span class="text-sm text-gray-600">گوگل</span>
                                </button>
                                <button class="flex-1 border border-gray-200 rounded-xl py-2.5 hover:bg-gray-50 transition flex items-center justify-center gap-2">
                                    <i class="fab fa-github text-gray-800"></i>
                                    <span class="text-sm text-gray-600">گیت‌هاب</span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="text-center mt-8">
                <a href="./index.html" class="text-gray-500 hover:text-orange-500 transition text-sm flex items-center justify-center gap-2">
                    <i class="fas fa-arrow-right"></i>
                    بازگشت به صفحه اصلی
                </a>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-white mt-12 py-6">
        <div class="container mx-auto px-4 text-center">
            <p class="text-slate-400 text-sm">© 1405 DSgift - فروشگاه تخصصی گیفت کارت</p>
        </div>
    </footer>
       <!-- دسترسی به داکیومنت های تیلویند نداشتم و این  کد های جاوا اسکریپت  توسط هوش مصنوعی زده شده  -->
    <script>
        const loginTabBtn = document.getElementById('loginTabBtn');
        const registerTabBtn = document.getElementById('registerTabBtn');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        
        function showLoginForm() {
            loginForm.classList.remove('hidden-form');
            loginForm.classList.add('show-form');
            registerForm.classList.remove('show-form');
            registerForm.classList.add('hidden-form');
            loginTabBtn.classList.add('active');
            registerTabBtn.classList.remove('active');
        }
        
        function showRegisterForm() {
            registerForm.classList.remove('hidden-form');
            registerForm.classList.add('show-form');
            loginForm.classList.remove('show-form');
            loginForm.classList.add('hidden-form');
            registerTabBtn.classList.add('active');
            loginTabBtn.classList.remove('active');
        }
        
        loginTabBtn.addEventListener('click', showLoginForm);
        registerTabBtn.addEventListener('click', showRegisterForm);
        
        document.querySelectorAll('.fa-eye').forEach(eyeBtn => {
            eyeBtn.addEventListener('click', function() {
                const input = this.closest('div').querySelector('input');
                if (input.type === 'password') {
                    input.type = 'text';
                    this.classList.remove('fa-eye');
                    this.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    this.classList.remove('fa-eye-slash');
                    this.classList.add('fa-eye');
                }
            });
        });
        
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                alert('این صفحه فقط فرانت‌اند است. بعداً به بک‌اند متصل خواهد شد.');
            });
        });
    </script>
</body>
</html>
